<!DOCTYPE html>
<html lang="es">
<head>

<script>
  // Aplica el tema guardado ANTES de pintar la pagina, para que no se vea
  // un parpadeo del tema equivocado al cargar.
  (function(){
    try{
      var saved = localStorage.getItem('mf-theme');
      if(saved) document.documentElement.setAttribute('data-theme', saved);
    }catch(e){}
  })();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg: #EFEFEF;
    --panel: #FFFFFF;
    --navy: #101010;
    --navy-2: #2A2A2A;
    --gold: #AEB2B8;
    --gold-soft: #E4E5E7;
    --ink: #1E222B;
    --heading: #101010;
    --muted: #767267;
    --border: rgba(16,16,16,0.12);
    --input-bg: #FFFFFF;
    --hover-row: rgba(0,0,0,0.025);
    --track: #EDEAE2;
    --chart-grid: rgba(16,16,16,0.06);
    --chart-border: #FFFFFF;
    --chart-accent: #54575C;
    --green: #3E6B55;
    --green-bg: #E7EFE9;
    --red: #96412E;
    --red-bg: #F4E7E3;
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #131416;
      --panel: #1C1D20;
      --ink: #ECECEE;
      --heading: #F5F5F6;
      --muted: #9B9DA3;
      --border: rgba(255,255,255,0.12);
      --input-bg: #232428;
      --hover-row: rgba(255,255,255,0.04);
      --track: rgba(255,255,255,0.08);
      --chart-grid: rgba(255,255,255,0.08);
      --chart-border: #1C1D20;
      --chart-accent: #B4B7BB;
      --green: #6FA98A;
      --green-bg: rgba(111,169,138,0.18);
      --red: #E08A6D;
      --red-bg: rgba(224,138,109,0.18);
    }
  }
  :root[data-theme="dark"]{
    --bg: #131416;
    --panel: #1C1D20;
    --ink: #ECECEE;
    --heading: #F5F5F6;
    --muted: #9B9DA3;
    --border: rgba(255,255,255,0.12);
    --input-bg: #232428;
    --hover-row: rgba(255,255,255,0.04);
    --track: rgba(255,255,255,0.08);
    --chart-grid: rgba(255,255,255,0.08);
    --chart-border: #1C1D20;
    --chart-accent: #B4B7BB;
    --green: #6FA98A;
    --green-bg: rgba(111,169,138,0.18);
    --red: #E08A6D;
    --red-bg: rgba(224,138,109,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', serif;}
  .num{font-variant-numeric: tabular-nums;}
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:220px; flex-shrink:0;
    background:var(--navy);
    color:#EDEAE2;
    display:flex; flex-direction:column;
    padding:28px 0 20px;
  }
  #sidebar .brand{
    padding:0 24px 28px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    margin-bottom:18px;
  }
  #sidebar .brand h1{font-size:20px; font-weight:500; margin:0; color:#fff;}
  #sidebar .brand span{font-size:11.5px; color:#ABAFB5; letter-spacing:.02em;}
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:3px;}
  .theme-toggle-btn{
    all:unset; cursor:pointer; flex-shrink:0;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; color:#fff; background:rgba(255,255,255,0.08);
    transition:background .15s;
  }
  .theme-toggle-btn:hover{background:rgba(255,255,255,0.16);}
  nav.tabs{display:flex; flex-direction:column; gap:2px; padding:0 12px;}
  nav.tabs button{
    all:unset; cursor:pointer;
    padding:10px 12px; border-radius:var(--radius);
    font-size:14px; color:#C9CBCE;
    display:flex; align-items:center; gap:10px;
    transition:background .15s, color .15s;
  }
  nav.tabs button:hover{background:rgba(255,255,255,0.06); color:#fff;}
  nav.tabs button.active{background:var(--navy-2); color:#fff; box-shadow: inset 2px 0 0 var(--gold);}
  #sidebar .foot{margin-top:auto; padding:0 24px; font-size:11.5px; color:#8C8E92;}
  #sidebar .foot p{margin:0 0 10px;}
  #sidebar .foot button{all:unset; cursor:pointer; color:#BFC2C6; text-decoration:underline; font-size:11.5px; display:block; margin-bottom:8px;}

  /* ---------- Main ---------- */
  #main{flex:1; padding:34px 40px 60px; max-width:1180px;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; flex-wrap:wrap; gap:12px;}
  .page-head h2{font-size:26px; font-weight:500; margin:0; color:var(--heading);}
  .page-head p{margin:4px 0 0; color:var(--muted); font-size:13px;}

  select, input[type=text], input[type=number], input[type=date], input[type=email], input[type=password]{
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--input-bg);
    color:var(--ink);
    width:100%;
  }
  select:focus, input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px;}

  .btn{
    all:unset; cursor:pointer;
    padding:9px 16px; border-radius:var(--radius);
    font-size:13.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{background:transparent; color:var(--heading); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--heading);}
  .btn-danger-text{all:unset; cursor:pointer; color:var(--red); font-size:12.5px;}
  .btn-danger-text:hover{text-decoration:underline;}
  .btn-link{all:unset; cursor:pointer; color:var(--heading); font-size:12.5px; text-decoration:underline;}

  /* ---------- Cards / KPIs ---------- */
  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px;}
  .kpi{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px;
  }
  .kpi .label{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .kpi .value{font-family:'Fraunces', serif; font-size:26px; font-weight:500;}
  .kpi.hero{grid-column:span 2; background:var(--navy); color:#fff; border:none;}
  .kpi.hero .label{color:#ABAFB5;}
  .kpi.hero .value{font-size:34px; color:#fff;}
  .value.positive{color:var(--green);}
  .value.negative{color:var(--red);}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; margin-bottom:22px;}
  .panel-table{padding:0; overflow:hidden;}
  .panel h3{font-size:15px; font-weight:600; margin:0 0 16px; font-family:'Work Sans'; color:var(--heading);}
  .charts-row{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
  .usd-summary{padding:16px 24px;}
  .usd-summary h3{margin:0 0 10px;}
  .usd-summary-row{display:flex; gap:28px; flex-wrap:wrap; font-size:13.5px; color:var(--muted);}
  .usd-summary-row b{font-family:'Fraunces', serif; font-size:16px; font-weight:600; margin-left:6px;}
  .chart-wrap{position:relative; height:280px;}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:11.5px; color:var(--muted); font-weight:600;
    padding:8px 10px; border-bottom:1px solid var(--border);
  }
  tbody td{padding:10px 10px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
  tbody tr:hover{background:var(--hover-row);}
  .badge{
    display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600;
  }
  .badge-ingreso{background:var(--green-bg); color:var(--green);}
  .badge-egreso{background:var(--red-bg); color:var(--red);}
  .amount-in{color:var(--green); font-weight:600;}
  .amount-out{color:var(--red); font-weight:600;}
  .row-actions{display:flex; gap:12px;}
  .empty-state{padding:50px 20px; text-align:center; color:var(--muted);}
  .empty-state .serif{font-size:19px; color:var(--heading); display:block; margin-bottom:6px;}

  .filters-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:flex-end;}
  .field{display:flex; flex-direction:column;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(16,16,16,0.45);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--panel); width:460px; max-width:92vw; border-radius:var(--radius);
    padding:26px 28px; max-height:88vh; overflow:auto;
  }
  .modal h3{margin:0 0 18px; font-size:18px; font-family:'Fraunces';}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}

  /* ---------- Presupuesto ---------- */
  .prog-bar{height:6px; background:var(--track); border-radius:6px; overflow:hidden; margin-top:6px;}
  .prog-fill{height:100%; border-radius:6px;}

  /* ---------- Categorías ---------- */
  .cat-cols{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .cat-list{list-style:none; margin:0; padding:0;}
  .cat-list li{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 4px; border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .add-cat-row{display:flex; gap:8px; margin-top:14px;}
  .add-cat-row input{flex:1;}

  /* ---------- Loading ---------- */
  #loading{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:100; font-family:'Fraunces'; color:var(--heading); font-size:16px;}

  /* ---------- Auth screen ---------- */
  #authScreen{position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:90; padding:20px;}
  #authScreen.show{display:flex;}
  .auth-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); width:380px; max-width:100%; padding:32px 28px;}
  .auth-card h1{font-size:22px; margin:0 0 4px; color:var(--heading);}
  .auth-card p.sub{color:var(--muted); font-size:13px; margin:0 0 22px;}
  .auth-card .field{margin-bottom:14px;}
  .auth-error{background:var(--red-bg); color:var(--red); padding:9px 12px; border-radius:var(--radius); font-size:12.5px; margin-bottom:14px; display:none;}
  .auth-error.show{display:block;}
  .auth-actions{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .auth-actions .btn{justify-content:center;}
  .auth-switch{text-align:center; margin-top:16px; font-size:12.5px; color:var(--muted);}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#fff; padding:11px 20px; border-radius:var(--radius);
    font-size:13px; opacity:0; transition:all .25s; pointer-events:none; z-index:200;
    max-width:90vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Menú móvil (oculto en escritorio) ---------- */
  .mobile-menu-btn{display:none;}
  #mobileMenuBackdrop{display:none;}

  @media (max-width: 880px){
    #app{flex-direction:column;}
    #sidebar{
      width:100%; flex-direction:row; align-items:center; justify-content:space-between;
      padding:12px 16px; position:fixed; top:0; left:0; right:0; z-index:60;
    }
    #sidebar .brand{border:none; padding:0; margin:0;}
    #sidebar .brand span{display:none;}

    .mobile-menu-btn{
      all:unset; display:flex; align-items:center; justify-content:center;
      width:34px; height:34px; color:#fff; font-size:22px; line-height:1; cursor:pointer; border-radius:var(--radius);
    }
    .mobile-menu-btn:active{background:rgba(255,255,255,0.1);}

    nav.tabs{
      position:fixed; bottom:0; left:0; right:0; z-index:60;
      flex-direction:row; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      justify-content:space-around; gap:0;
      background:var(--navy); border-top:1px solid rgba(255,255,255,0.08);
    }
    nav.tabs button{
      flex:1; justify-content:center; text-align:center; white-space:normal;
      padding:8px 2px; font-size:10px; line-height:1.2; border-radius:var(--radius); gap:0;
    }
    nav.tabs button.active{box-shadow:none; background:rgba(255,255,255,0.1);}

    #sidebar .foot{
      display:none; position:fixed; top:60px; right:12px; z-index:70;
      background:var(--navy-2); border-radius:var(--radius); padding:16px 18px;
      flex-direction:column; align-items:flex-start; gap:10px; min-width:210px;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
    }
    #sidebar .foot p{margin:0;}
    #sidebar .foot button{margin-bottom:0;}
    body.mobile-menu-open #sidebar .foot{display:flex;}
    body.mobile-menu-open #mobileMenuBackdrop{
      display:block; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:65;
    }

    #main{padding:78px 16px 90px;}
    .panel-table{overflow-x:auto; -webkit-overflow-scrolling:touch;}
    .panel-table table{min-width:640px;}
    .kpi-row{grid-template-columns:1fr 1fr;}
    .kpi.hero{grid-column:span 2;}
    .charts-row{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
    .cat-cols{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="loading">Cargando tus datos…</div>

<div id="authScreen">
  <div class="auth-card">
    <h1>Mis Finanzas</h1>
    <p class="sub">Iniciá sesión para ver tus datos, sincronizados entre todos tus dispositivos.</p>
    <div class="auth-error" id="authError"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="authEmail" autocomplete="email">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="authPassword" autocomplete="current-password">
    </div>
    <div class="auth-actions">
      <button class="btn btn-primary" id="btnLogin">Ingresar</button>
      <button class="btn btn-ghost" id="btnRegister">Crear cuenta nueva</button>
    </div>
    <p class="auth-switch">La primera vez, usá "Crear cuenta nueva" con tu email y una contraseña. Después, iniciá sesión con lo mismo en cada dispositivo.</p>
  </div>
</div>

<div id="app" style="display:none;">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <h1>Mis Finanzas</h1>
        <button id="btnThemeToggle" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Cambiar tema" title="Cambiar tema">☀</button>
      </div>
      <span>Pesos uruguayos · $UY</span>
    </div>
    <button id="btnMobileMenu" class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Más opciones">⋮</button>
    <nav class="tabs" id="nav">
      <button data-tab="resumen" class="active">Resumen</button>
      <button data-tab="movimientos">Movimientos</button>
      <button data-tab="presupuesto">Presupuesto</button>
      <button data-tab="categorias">Categorías</button>
      <button data-tab="graficos">Gráficos</button>
    </nav>
    <div class="foot">
      <p id="userEmailLabel">Conectado</p>
      <button onclick="document.body.classList.remove('mobile-menu-open'); exportData()">Exportar copia (.json)</button>
      <button onclick="document.body.classList.remove('mobile-menu-open'); document.getElementById('importFile').click()">Importar copia (.json)</button>
      <button onclick="document.body.classList.remove('mobile-menu-open'); doLogout()">Cerrar sesión</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  </aside>
  <div id="mobileMenuBackdrop" onclick="toggleMobileMenu()"></div>

  <main id="main"></main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   FIREBASE — completá esto con los datos de TU proyecto
   (Firebase console → ⚙ Configuración del proyecto → Tus apps → SDK setup)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDsRoQjUWW_Kv8hsNhj5az8LXT4myME7tU",
  authDomain: "mis-finanzas-2026-cr.firebaseapp.com",
  projectId: "mis-finanzas-2026-cr",
  storageBucket: "mis-finanzas-2026-cr.firebasestorage.app",
  messagingSenderId: "855377217162",
  appId: "1:855377217162:web:d4476dba0ed691aa498f73"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ============================================================
   ESTADO Y PERSISTENCIA
   ============================================================ */
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

let state = {
  categoriasEgreso: ["Alquiler","Cuota auto","Seguros","Servicios (luz/agua/internet)","Celular","Suscripciones",
    "Supermercado/Almacén","Transporte","Salidas/Ocio","Salud","Ropa","Educación","Imprevistos","Otros egresos"],
  categoriasIngreso: ["Sueldo","Ingreso extra","Ventas","Otros ingresos"],
  mediosPago: ["Efectivo","Débito","Crédito","Transferencia"],
  movimientos: [],
  presupuesto: {}, // { "Alquiler": 18000, ... }
  recurrentes: [], // [{id, tipo, categoria, descripcion, medio, monto, moneda, dia, activo}]
  metas: [], // [{id, nombre, objetivo, moneda, aportes:[{id,fecha,monto}]}]
};

function seedIfEmpty(){
  if(state.movimientos.length) return;
  const y = new Date().getFullYear(), m = String(new Date().getMonth()+1).padStart(2,'0');
  state.movimientos = [
    {id:cryptoId(), fecha:`${y}-${m}-01`, tipo:"Egreso", categoria:"Alquiler", descripcion:"Alquiler apartamento", medio:"Transferencia", monto:18000, notas:"Vence el 1ro de cada mes"},
    {id:cryptoId(), fecha:`${y}-${m}-02`, tipo:"Ingreso", categoria:"Sueldo", descripcion:"Sueldo mensual", medio:"Transferencia", monto:55000, notas:""},
    {id:cryptoId(), fecha:`${y}-${m}-03`, tipo:"Egreso", categoria:"Cuota auto", descripcion:"Cuota financiación auto", medio:"Débito", monto:9500, notas:"Cuota 14 de 36"},
    {id:cryptoId(), fecha:`${y}-${m}-04`, tipo:"Egreso", categoria:"Supermercado/Almacén", descripcion:"Compras del almacén", medio:"Efectivo", monto:850, notas:"Pan, leche, fiambre"},
  ];
  state.presupuesto = {
    "Alquiler":18000, "Cuota auto":9500, "Seguros":2000, "Servicios (luz/agua/internet)":4000,
    "Celular":1200, "Suscripciones":900, "Supermercado/Almacén":15000, "Transporte":3000,
    "Salidas/Ocio":4000, "Salud":2500, "Ropa":2000, "Educación":0, "Imprevistos":2000, "Otros egresos":1000
  };
}

function cryptoId(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

function escapeHtml(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============================================================
   AUTENTICACIÓN
   ============================================================ */
let currentUser = null;
let unsubscribeDoc = null;
let applyingRemoteUpdate = false;

function authErr(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
}
function clearAuthErr(){
  document.getElementById('authError').classList.remove('show');
}

function friendlyAuthError(code){
  const map = {
    'auth/invalid-email':'Ese email no es válido.',
    'auth/user-not-found':'No existe una cuenta con ese email. Probá "Crear cuenta nueva".',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/invalid-credential':'Email o contraseña incorrectos.',
    'auth/email-already-in-use':'Ya existe una cuenta con ese email. Iniciá sesión en vez de crear una nueva.',
    'auth/weak-password':'La contraseña tiene que tener al menos 6 caracteres.',
    'auth/network-request-failed':'Sin conexión a internet. Revisá tu red e intentá de nuevo.',
  };
  return map[code] || 'Ocurrió un error. Intentá de nuevo.';
}

  const pass = document.getElementById('authPassword').value;

    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    authErr(friendlyAuthError(e.code));

});

document.getElementById('btnRegister').addEventListener('click', async ()=>{
  clearAuthErr();
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  if(!email || !pass){ authErr('Completá email y contraseña.'); return; }
  try{
    await auth.createUserWithEmailAndPassword(email, pass);
  }catch(e){
    authErr(friendlyAuthError(e.code));
  }
});

/* ============================================================
   MODO CLARO / OSCURO
   ============================================================ */
function applyThemeButtonLabel(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.hasAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const btn = document.getElementById('btnThemeToggle');
  btn.textContent = isDark ? '☾' : '☀';
  btn.title = isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
  btn.setAttribute('aria-label', btn.title);
}

function toggleTheme(){
  const isDarkNow = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.hasAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDarkNow ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('mf-theme', next); }catch(e){}
  applyThemeButtonLabel();
  document.body.classList.remove('mobile-menu-open');
  if(currentTab) renderTab(currentTab); // recrea los gráficos con los colores del nuevo tema
}

/* ============================================================
   DATOS EN FIRESTORE (un documento por usuario → sincroniza solo)
   ============================================================ */
function userDocRef(){
  return db.collection('finanzas').doc(currentUser.uid);
}

function listenToData(){
  if(unsubscribeDoc) unsubscribeDoc();
  let first = true;
  unsubscribeDoc = userDocRef().onSnapshot(async (snap)=>{
    if(snap.exists){
      applyingRemoteUpdate = true;
      state = Object.assign({}, state, snap.data());
      applyingRemoteUpdate = false;
    } else if(first){
      seedIfEmpty();
      await saveData();
    }
    if(first){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      renderTab(currentTab || 'resumen');
      first = false;
      generarRecurrentesFaltantes();
    } else {
      renderTab(currentTab);
    }
  }, (err)=>{
    console.error('No se pudo leer la base de datos', err);
    toast('No se pudieron cargar tus datos — revisá tu conexión');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  });
}

let saveTimer=null;
function saveData(){
  if(applyingRemoteUpdate) return Promise.resolve();
  return new Promise((resolve)=>{
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        await userDocRef().set(state);
      }catch(e){
        console.error('No se pudo guardar', e);
        toast('No se pudo guardar — revisá tu conexión');
      }
      resolve();
    }, 150);
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function fmt(n, moneda){
  n = Number(n)||0;
  const symbol = moneda==='USD' ? 'US$ ' : '$ ';
  return symbol + n.toLocaleString('es-UY', {maximumFractionDigits:0});
}

document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed!=='object') throw new Error('formato inválido');
      if(!confirm('Esto reemplaza todos tus datos actuales por los del archivo importado. ¿Continuar?')) return;
      state = Object.assign({
        categoriasEgreso:[], categoriasIngreso:[], mediosPago:[], movimientos:[], presupuesto:{}
      }, parsed);
      await saveData();
      renderTab(currentTab);
      toast('Datos importados correctamente');
    }catch(err){
      toast('No se pudo leer ese archivo — ¿es un backup de Mis Finanzas?');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

/* ============================================================
   HELPERS DE DATOS
   ============================================================ */
function monthKey(dateStr){ return dateStr.slice(0,7); } // "2026-09"

function totalsForMonth(ym){
  let ing=0, egr=0, ingUSD=0, egrUSD=0;
  state.movimientos.forEach(m=>{
    if(monthKey(m.fecha)!==ym) return;
    const esUSD = m.moneda==='USD';
    if(m.tipo==='Ingreso'){ if(esUSD) ingUSD+=Number(m.monto); else ing+=Number(m.monto); }
    else{ if(esUSD) egrUSD+=Number(m.monto); else egr+=Number(m.monto); }
  });
  return {ing, egr, bal: ing-egr, ingUSD, egrUSD, balUSD: ingUSD-egrUSD};
}

function categoryTotalsForMonth(ym){
  // El presupuesto y los gráficos por categoría están en pesos: los
  // egresos cargados en USD no se suman acá (ver resumen aparte en dólares).
  const totals = {};
  state.categoriasEgreso.forEach(c=>totals[c]=0);
  state.movimientos.forEach(m=>{
    if(m.tipo!=='Egreso' || monthKey(m.fecha)!==ym || m.moneda==='USD') return;
    totals[m.categoria] = (totals[m.categoria]||0) + Number(m.monto);
  });
  return totals;
}

function last12MonthKeys(){
  const arr=[];
  const now = new Date();
  for(let i=11;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    arr.push(d.toISOString().slice(0,7));
  }
  return arr;
}

function ymLabel(ym){
  const [y,m] = ym.split('-');
  return MESES[parseInt(m,10)-1].slice(0,3)+' '+y.slice(2);
}

function ymLabelFull(ym){
  const [y,m] = ym.split('-');
  return MESES[parseInt(m,10)-1] + ' ' + y;
}

function currentYM(){ return new Date().toISOString().slice(0,7); }

function monthKeysForYear(year){
  const arr=[];
  for(let m=1;m<=12;m++) arr.push(`${year}-${String(m).padStart(2,'0')}`);
  return arr;
}

function categoryTotalsForYear(year){
  const totals = {};
  state.categoriasEgreso.forEach(c=>totals[c]=0);
  state.movimientos.forEach(m=>{
    if(m.tipo!=='Egreso' || m.fecha.slice(0,4)!==String(year) || m.moneda==='USD') return;
    totals[m.categoria] = (totals[m.categoria]||0) + Number(m.monto);
  });
  return totals;
}

function yearOptions(selected){
  const years = new Set(state.movimientos.map(m=>m.fecha.slice(0,4)));
  years.add(String(new Date().getFullYear()));
  const sorted = [...years].sort();
  return sorted.map(y=>`<option value="${y}" ${y===String(selected)?'selected':''}>${y}</option>`).join('');
}

  return sorted.map(k=>`<option value="${k}" ${k===selected?'selected':''}>${ymLabelFull(k)}</option>`).join('');
}

      </div>
      <div class="kpi">
        <div class="label">Egresos</div>
        <div class="value num negative">${fmt(t.egr)}</div>
      </div>

        <div class="label">Balance acumulado (año)</div>
        <div class="value num ${yearBal>=0?'positive':'negative'}">${fmt(yearBal)}</div>
      </div>

/* ============================================================
   METAS DE AHORRO
   ============================================================ */
function metaAhorrado(meta){
  return (meta.aportes||[]).reduce((s,a)=>s+Number(a.monto),0);
}

function viewMetasPanel(){
  return `
    <div class="panel">
      <div class="page-head" style="margin-bottom:16px;">
        <div>
          <h3 style="margin:0;">Metas de ahorro</h3>
          <p style="margin:4px 0 0; color:var(--muted); font-size:13px;">Definí un objetivo y sumá aportes cuando ahorres.</p>
        </div>
        <button class="btn btn-primary" onclick="openMetaForm()">+ Nueva meta</button>
      </div>
      ${state.metas.length===0 ? `
        <div class="empty-state" style="padding:24px 20px;">Todavía no tenés metas de ahorro cargadas.</div>
      ` : state.metas.map(meta=>{
        const ahorrado = metaAhorrado(meta);
        const objetivo = Number(meta.objetivo)||0;
        const pct = objetivo>0 ? Math.min(ahorrado/objetivo,1)*100 : 0;
        const color = pct>=100 ? 'var(--green)' : 'var(--gold)';
        const aportes = (meta.aportes||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
        return `
        <div style="padding:16px 0; border-bottom:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
            <div>
              <div style="font-weight:600;">${escapeHtml(meta.nombre)}</div>
              <div style="font-size:12.5px; color:var(--muted); margin-top:2px;">${fmt(ahorrado, meta.moneda)} de ${fmt(objetivo, meta.moneda)} · ${Math.round(pct)}%</div>
            </div>
            <div class="row-actions">
              <button class="btn-link" onclick="openAporteForm('${meta.id}')">+ Aporte</button>
              <button class="btn-link" onclick="openMetaForm('${meta.id}')">Editar</button>
              <button class="btn-danger-text" onclick="deleteMeta('${meta.id}')">Eliminar</button>
            </div>
          </div>
          <div class="prog-bar" style="margin-top:10px;"><div class="prog-fill" style="width:${pct}%; background:${color};"></div></div>
          ${aportes.length ? `
            <div style="margin-top:10px; display:flex; flex-direction:column; gap:4px;">
              ${aportes.slice(0,5).map(a=>`
                <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted);">
                  <span>${formatFecha(a.fecha)}</span>
                  <span class="num">${fmt(a.monto, meta.moneda)} <button class="btn-danger-text" style="margin-left:8px;" onclick="deleteAporte('${meta.id}','${a.id}')">Quitar</button></span>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}

function openMetaForm(id){
  const editing = id ? state.metas.find(m=>m.id===id) : null;
  document.getElementById('modalBody').innerHTML = `
    <h3>${editing?'Editar meta':'Nueva meta de ahorro'}</h3>
    <div class="form-grid">
      <div class="field full">
        <label>Nombre</label>
        <input type="text" id="gNombre" value="${editing?escapeHtml(editing.nombre):''}" placeholder="Ej: Vacaciones, Fondo de emergencia">
      </div>
      <div class="field">
        <label>Moneda</label>
        <select id="gMoneda">
          <option value="UYU" ${(!editing||editing.moneda!=='USD')?'selected':''}>$ Pesos (UYU)</option>
          <option value="USD" ${editing&&editing.moneda==='USD'?'selected':''}>US$ Dólares (USD)</option>
        </select>
      </div>
      <div class="field">
        <label>Objetivo</label>
        <input type="number" id="gObjetivo" value="${editing?editing.objetivo:''}" min="0" step="1">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveMeta('${editing?editing.id:''}')">${editing?'Guardar cambios':'Crear meta'}</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}

function saveMeta(id){
  const nombre = document.getElementById('gNombre').value.trim();
  const objetivo = parseFloat(document.getElementById('gObjetivo').value);
  if(!nombre){ toast('Ponele un nombre a la meta'); return; }
  if(!objetivo || objetivo<=0){ toast('Ingresá un objetivo válido'); return; }
  const moneda = document.getElementById('gMoneda').value;
  if(id){
    const meta = state.metas.find(m=>m.id===id);
    Object.assign(meta, {nombre, objetivo, moneda});
  } else {
    state.metas.push({id:cryptoId(), nombre, objetivo, moneda, aportes:[]});
  }
  saveData();
  closeModal();
  renderTab('resumen');
  toast(id?'Meta actualizada':'Meta creada');
}

function deleteMeta(id){
  if(!confirm('¿Eliminar esta meta de ahorro? Se pierde el historial de aportes.')) return;
  state.metas = state.metas.filter(m=>m.id!==id);
  saveData();
  renderTab('resumen');
  toast('Meta eliminada');
}

function openAporteForm(metaId){
  const meta = state.metas.find(m=>m.id===metaId);
  document.getElementById('modalBody').innerHTML = `
    <h3>Nuevo aporte — ${escapeHtml(meta.nombre)}</h3>
    <div class="form-grid">
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="aFecha" value="${new Date().toISOString().slice(0,10)}">
      </div>
      <div class="field">
        <label>Monto (${meta.moneda==='USD'?'US$':'$'})</label>
        <input type="number" id="aMonto" min="0" step="1">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveAporte('${metaId}')">Agregar aporte</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}

function saveAporte(metaId){
  const monto = parseFloat(document.getElementById('aMonto').value);
  if(!monto || monto<=0){ toast('Ingresá un monto válido'); return; }
  const fecha = document.getElementById('aFecha').value;
  const meta = state.metas.find(m=>m.id===metaId);
  if(!meta.aportes) meta.aportes = [];
  meta.aportes.push({id:cryptoId(), fecha, monto});
  saveData();
  closeModal();
  renderTab('resumen');
  toast('Aporte agregado');
}

function deleteAporte(metaId, aporteId){
  if(!confirm('¿Quitar este aporte?')) return;
  const meta = state.metas.find(m=>m.id===metaId);
  meta.aportes = (meta.aportes||[]).filter(a=>a.id!==aporteId);
  saveData();
  renderTab('resumen');
  toast('Aporte eliminado');
}

let chartBarInstance=null, chartPieInstance=null;
function afterRenderResumen(){
  document.getElementById('selResumenMes').addEventListener('change', (e)=>{
    selectedResumenYM = e.target.value;
    renderTab('resumen');
  });

  applyChartTheme();
  const keys = last12MonthKeys();
  const ingSeries = keys.map(k=>totalsForMonth(k).ing);
  const egrSeries = keys.map(k=>totalsForMonth(k).egr);
  const labels = keys.map(ymLabel);

  if(chartBarInstance) chartBarInstance.destroy();
  chartBarInstance = new Chart(document.getElementById('chartBar'), {
    type:'bar',
    data:{ labels, datasets:[
      {label:'Ingresos', data:ingSeries, backgroundColor:cssVar('--green'), borderRadius:2, maxBarThickness:22},
      {label:'Egresos', data:egrSeries, backgroundColor:cssVar('--red'), borderRadius:2, maxBarThickness:22},
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom', labels:{boxWidth:10, font:{family:'Work Sans', size:11}}} },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{family:'Work Sans', size:10.5}} },
        y:{ grid:{color:cssVar('--chart-grid')}, ticks:{callback:v=>fmt(v), font:{family:'Work Sans', size:10.5}} }
      }
    }
  });

  const catTotals = categoryTotalsForMonth(selectedResumenYM);
  const entries = Object.entries(catTotals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const palette = categoryPalette();

  if(chartPieInstance) chartPieInstance.destroy();
  if(entries.length===0){
    document.getElementById('chartPie').parentElement.innerHTML = '<div class="empty-state" style="padding-top:70px;">Sin egresos cargados este mes.</div>';
  } else {
    chartPieInstance = new Chart(document.getElementById('chartPie'), {
      type:'doughnut',
      data:{ labels:entries.map(e=>e[0]), datasets:[{ data:entries.map(e=>e[1]), backgroundColor:palette, borderWidth:2, borderColor:cssVar('--chart-border') }] },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:'right', labels:{boxWidth:9, font:{family:'Work Sans', size:10.5}, padding:8}} }
      }
    });
  }
}

        legend:{position:'bottom', labels:{boxWidth:10, font:{family:'Work Sans', size:11}}} },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{family:'Work Sans', size:10.5}} },

  // --- Gráfico anual: balance acumulado ---
  let acumulado = 0;
  const balAcumSeries = keys.map(k=>{ acumulado += totalsForMonth(k).bal; return acumulado; });
  if(chartAnioBalanceInstance) chartAnioBalanceInstance.destroy();
  chartAnioBalanceInstance = new Chart(document.getElementById('chartAnioBalance'), {
    type:'line',

    }]},

      responsive:true, maintainAspectRatio:false,
      plugins:{ title:{display:true, text:'Balance acumulado en el año', font:{family:'Work Sans', size:12, weight:'600'}, color:cssVar('--heading'), padding:{bottom:10}},
        legend:{display:false} },

        x:{ grid:{display:false}, ticks:{font:{family:'Work Sans', size:10.5}} },

/* ============================================================
   EXPORTAR PDF DEL MES
   ============================================================ */
function generatePDF(ym){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const t = totalsForMonth(ym);
  const catTotals = categoryTotalsForMonth(ym);

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(16,16,16);
  doc.text('Mis Finanzas', 14, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(80,80,80);
  doc.text(`Informe mensual — ${ymLabelFull(ym)}`, 14, 26);
  doc.setDrawColor(210); doc.line(14, 31, 196, 31);

  doc.setFontSize(11); doc.setTextColor(30,34,43);
  doc.text(`Ingresos: ${fmt(t.ing)}`, 14, 41);
  doc.text(`Egresos: ${fmt(t.egr)}`, 14, 48);
  doc.setFont('helvetica','bold');
  doc.text(`Balance: ${fmt(t.bal)}`, 14, 55);
  doc.setFont('helvetica','normal');

  const catRows = state.categoriasEgreso
    .map(c=>[c, fmt(state.presupuesto[c]||0), fmt(catTotals[c]||0)])
    .filter((row,i)=> (state.presupuesto[state.categoriasEgreso[i]]||0)>0 || (catTotals[state.categoriasEgreso[i]]||0)>0);

  doc.autoTable({
    startY: 63,
    head: [['Categoría','Presupuestado','Real']],
    body: catRows.length?catRows:[['Sin egresos cargados este mes','—','—']],
    theme: 'grid',
    headStyles:{ fillColor:[16,16,16], fontSize:9 },
    styles:{ fontSize:9, textColor:[30,34,43] },
  });

  const movs = state.movimientos.filter(m=>monthKey(m.fecha)===ym).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const movRows = movs.map(m=>[
    formatFecha(m.fecha), m.tipo, m.categoria, m.descripcion||'—', m.medio,
    (m.tipo==='Ingreso'?'+ ':'- ')+fmt(m.monto, m.moneda)
  ]);

  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 12,
    head: [['Fecha','Tipo','Categoría','Descripción','Medio','Monto']],
    body: movRows.length?movRows:[['—','—','—','Sin movimientos este mes','—','—']],
    theme: 'striped',
    headStyles:{ fillColor:[16,16,16], fontSize:9 },
    styles:{ fontSize:8, textColor:[30,34,43] },
  });

  doc.save(`finanzas-${ym}.pdf`);
  toast('PDF descargado');
}

/* ============================================================
   EXPORTAR A EXCEL
   ============================================================ */
function exportExcel(){
  const rows = lastMovRows.length ? lastMovRows : state.movimientos;
  if(rows.length===0){ toast('No hay movimientos para exportar'); return; }
  const data = rows.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(m=>({
    Fecha: formatFecha(m.fecha),
    Tipo: m.tipo,
    Categoría: m.categoria,
    Descripción: m.descripcion || '',
    Medio: m.medio,
    Moneda: m.moneda==='USD' ? 'USD' : 'UYU',
    Monto: Number(m.monto),
    Notas: m.notas || '',
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:11},{wch:9},{wch:22},{wch:30},{wch:13},{wch:8},{wch:12},{wch:26}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Movimientos');
  XLSX.writeFile(wb, `mis-finanzas-movimientos.xlsx`);
  toast('Excel descargado');
}

  const [y,m,d] = f.split('-');
  return `${d}/${m}/${y}`;
}

function deleteMov(id){

  state.movimientos = state.movimientos.filter(m=>m.id!==id);
  saveData();
  renderTab('movimientos');
  toast('Movimiento eliminado');
}

function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

function saveMov(id){
  const monto = parseFloat(document.getElementById('mMonto').value);
  if(!monto || monto<=0){ toast('Ingresá un monto válido'); return; }
  const data = {
    tipo: document.getElementById('mTipo').value,
    fecha: document.getElementById('mFecha').value,
    categoria: document.getElementById('mCategoria').value,
    descripcion: document.getElementById('mDescripcion').value,
    medio: document.getElementById('mMedio').value,
    monto: monto,
    moneda: document.getElementById('mMoneda').value,
    notas: document.getElementById('mNotas').value,
  };
  if(id){
    const idx = state.movimientos.findIndex(m=>m.id===id);
    state.movimientos[idx] = Object.assign({id}, data);
  } else {
    state.movimientos.push(Object.assign({id:cryptoId()}, data));
  }
  saveData();
  closeModal();
  renderTab('movimientos');
  toast(id?'Movimiento actualizado':'Movimiento agregado');
}

/* ============================================================
   RECURRENTES (se cargan solos cada mes)
   ============================================================ */
function daysInMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}

function generarRecurrentesFaltantes(){
  const ym = currentYM();
  let creados = 0;
  state.recurrentes.forEach(r=>{
    if(r.activo===false) return;
    const yaExiste = state.movimientos.some(m=>m.recurrenteId===r.id && monthKey(m.fecha)===ym);
    if(yaExiste) return;
    const dia = Math.min(r.dia, daysInMonth(ym));
    state.movimientos.push({
      id:cryptoId(), recurrenteId:r.id,
      fecha:`${ym}-${String(dia).padStart(2,'0')}`,
      tipo:r.tipo, categoria:r.categoria, descripcion:r.descripcion,
      medio:r.medio, monto:r.monto, moneda:r.moneda||'UYU', notas:'Cargado automáticamente (recurrente)',
    });
    creados++;
  });
  if(creados>0){
    saveData();
    toast(creados===1 ? 'Se cargó 1 movimiento recurrente de este mes' : `Se cargaron ${creados} movimientos recurrentes de este mes`);
  }
}

function openRecurrenteForm(id){
  const editing = id ? state.recurrentes.find(r=>r.id===id) : null;
  const tipo = editing ? editing.tipo : 'Egreso';
  const cats = tipo==='Ingreso' ? state.categoriasIngreso : state.categoriasEgreso;

  document.getElementById('modalBody').innerHTML = `
    <h3>${editing?'Editar recurrente':'Nuevo recurrente'}</h3>
    <div class="form-grid">
      <div class="field">
        <label>Tipo</label>
        <select id="rTipo">
          <option value="Egreso" ${tipo==='Egreso'?'selected':''}>Egreso</option>
          <option value="Ingreso" ${tipo==='Ingreso'?'selected':''}>Ingreso</option>
        </select>
      </div>
      <div class="field">
        <label>Día del mes</label>
        <input type="number" id="rDia" value="${editing?editing.dia:1}" min="1" max="28">
      </div>
      <div class="field full">
        <label>Categoría</label>
        <select id="rCategoria">${cats.map(c=>`<option ${editing&&editing.categoria===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select>
      </div>
      <div class="field full">
        <label>Descripción</label>
        <input type="text" id="rDescripcion" value="${editing?escapeHtml(editing.descripcion):''}" placeholder="Ej: Alquiler">
      </div>
      <div class="field">
        <label>Medio de pago</label>
        <select id="rMedio">${state.mediosPago.map(m=>`<option ${editing&&editing.medio===m?'selected':''}>${escapeHtml(m)}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>Moneda</label>
        <select id="rMoneda">
          <option value="UYU" ${(!editing||editing.moneda!=='USD')?'selected':''}>$ Pesos (UYU)</option>
          <option value="USD" ${editing&&editing.moneda==='USD'?'selected':''}>US$ Dólares (USD)</option>
        </select>
      </div>
      <div class="field">
        <label>Monto</label>
        <input type="number" id="rMonto" value="${editing?editing.monto:''}" min="0" step="1">
      </div>
      <div class="field full">
        <label style="display:flex; align-items:center; gap:8px; margin-bottom:0;">
          <input type="checkbox" id="rActivo" style="width:auto;" ${(!editing||editing.activo!==false)?'checked':''}>
          Activo (se sigue cargando cada mes)
        </label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveRecurrente('${editing?editing.id:''}')">${editing?'Guardar cambios':'Agregar'}</button>
    </div>
  `;
  document.getElementById('rTipo').addEventListener('change', (e)=>{
    const cs = e.target.value==='Ingreso' ? state.categoriasIngreso : state.categoriasEgreso;
    document.getElementById('rCategoria').innerHTML = cs.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
  });
  document.getElementById('overlay').classList.add('show');
}

function saveRecurrente(id){
  const monto = parseFloat(document.getElementById('rMonto').value);
  if(!monto || monto<=0){ toast('Ingresá un monto válido'); return; }
  let dia = parseInt(document.getElementById('rDia').value, 10);
  if(!dia || dia<1) dia=1;
  if(dia>28) dia=28;
  const data = {
    tipo: document.getElementById('rTipo').value,
    categoria: document.getElementById('rCategoria').value,
    descripcion: document.getElementById('rDescripcion').value,
    medio: document.getElementById('rMedio').value,
    moneda: document.getElementById('rMoneda').value,
    monto: monto,
    dia: dia,
    activo: document.getElementById('rActivo').checked,
  };
  if(id){
    const idx = state.recurrentes.findIndex(r=>r.id===id);
    state.recurrentes[idx] = Object.assign({id}, data);
  } else {
    state.recurrentes.push(Object.assign({id:cryptoId()}, data));
  }
  saveData();
  closeModal();
  generarRecurrentesFaltantes();
  renderTab('presupuesto');
  toast(id?'Recurrente actualizado':'Recurrente agregado');
}

function deleteRecurrente(id){
  if(!confirm('¿Eliminar este recurrente? Los movimientos ya generados no se borran.')) return;
  state.recurrentes = state.recurrentes.filter(r=>r.id!==id);
  saveData();
  renderTab('presupuesto');
  toast('Recurrente eliminado');
}

/* ============================================================
   VISTA: CATEGORÍAS
   ============================================================ */
function viewCategorias(){
  return `
    <div class="page-head">
      <div>
        <h2>Categorías</h2>
        <p>Estas son las opciones que aparecen al cargar un movimiento.</p>
      </div>
    </div>
    <div class="cat-cols">
      <div class="panel">
        <h3>Categorías de egreso</h3>
        <ul class="cat-list" id="listEgreso">
          ${state.categoriasEgreso.map(c=>`<li>${escapeHtml(c)} <button class="btn-danger-text" onclick="removeCat('egreso','${c.replace(/'/g,"\\'")}')">Quitar</button></li>`).join('')}
        </ul>
        <div class="add-cat-row">
          <input type="text" id="newCatEgreso" placeholder="Nueva categoría de egreso">
          <button class="btn btn-ghost" onclick="addCat('egreso')">Agregar</button>
        </div>
      </div>
      <div class="panel">
        <h3>Categorías de ingreso</h3>
        <ul class="cat-list" id="listIngreso">
          ${state.categoriasIngreso.map(c=>`<li>${escapeHtml(c)} <button class="btn-danger-text" onclick="removeCat('ingreso','${c.replace(/'/g,"\\'")}')">Quitar</button></li>`).join('')}
        </ul>
        <div class="add-cat-row">
          <input type="text" id="newCatIngreso" placeholder="Nueva categoría de ingreso">
          <button class="btn btn-ghost" onclick="addCat('ingreso')">Agregar</button>
        </div>
      </div>
    </div>
  `;
}

function afterRenderCategorias(){}

function addCat(tipo){
  const inputId = tipo==='egreso'?'newCatEgreso':'newCatIngreso';
  const val = document.getElementById(inputId).value.trim();
  if(!val) return;
  const arr = tipo==='egreso'?state.categoriasEgreso:state.categoriasIngreso;
  if(arr.includes(val)){ toast('Esa categoría ya existe'); return; }
  arr.push(val);
  if(tipo==='egreso' && !(val in state.presupuesto)) state.presupuesto[val]=0;
  saveData();
  renderTab('categorias');
  toast('Categoría agregada');
}

function removeCat(tipo, cat){
  if(!confirm(`¿Quitar "${cat}" de las categorías? Los movimientos ya cargados con esta categoría no se modifican.`)) return;
  if(tipo==='egreso'){
    state.categoriasEgreso = state.categoriasEgreso.filter(c=>c!==cat);
    delete state.presupuesto[cat];
  } else {
    state.categoriasIngreso = state.categoriasIngreso.filter(c=>c!==cat);
  }
  saveData();
  renderTab('categorias');
}

  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('No se pudo registrar el service worker', e));
  });
}
</script>
